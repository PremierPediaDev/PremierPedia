<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PremierPedia document repository" />
    <title>PremierPedia</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <div class="brand" aria-label="PremierPedia">
          <span class="brand-wordmark">PremierPedia</span>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="browser" aria-label="Documentation browser">
        <div class="toolbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10.4 3.7a6.7 6.7 0 1 1 0 13.4 6.7 6.7 0 0 1 0-13.4Zm0 0 9.1 9.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <input id="searchInput" class="search-input" type="search" placeholder="Search files recursively" aria-label="Search files recursively" />
          </div>

          <div class="toolbar-actions">
            <button id="refreshButton" class="button button-secondary" type="button">Refresh</button>
            <button id="uploadButton" class="button" type="button">Upload</button>
            <button id="removeButton" class="button button-secondary danger" type="button">Remove selected</button>
            <input id="fileInput" type="file" hidden />
          </div>
        </div>

        <div class="meta-row">
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
          <span id="itemCount" class="item-count"></span>
        </div>

        <div class="table-wrap">
          <table class="file-table">
            <thead>
              <tr>
                <th class="checkbox-column"><input id="selectAll" type="checkbox" aria-label="Select all items" /></th>
                <th>Name</th>
                <th>Type</th>
                <th>Size</th>
                <th>Modified</th>
              </tr>
            </thead>
            <tbody id="fileRows"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state" role="status" aria-live="polite">
          <h2>No documents found</h2>
          <p>Try another search or refresh the repository.</p>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script src="index.js" defer></script>
  </body>
</html>
