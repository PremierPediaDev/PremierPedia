<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PremierPedia document repository" />
    <title>PremierPedia</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <div class="header-left">
          <div class="brand" aria-label="PremierPedia">
            <span class="brand-wordmark">PremierPedia</span>
          </div>
          <span class="header-separator" aria-hidden="true">|</span>
          <div class="header-search-tools">
            <div class="search-wrap">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/>
                <path d="m15.5 15.5 4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <input id="searchInput" class="search-input" type="search" placeholder="Search files" aria-label="Search files recursively" />
            </div>
          </div>
          <span class="header-separator" aria-hidden="true">|</span>
          <button id="refreshButton" class="header-icon-button" type="button" aria-label="Refresh documents" title="Refresh documents">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
              <path d="M20 11a8 8 0 1 1-2.34-5.66L20 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M20 4v4h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
        <div class="header-utilities">
          <button id="themeToggleButton" class="header-icon-button" type="button" aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
              <path d="M20.2 15.1A8.5 8.5 0 0 1 8.9 3.8 8.5 8.5 0 1 0 20.2 15.1Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <span class="header-separator" aria-hidden="true">|</span>
          <button id="demoSignInButton" class="header-sign-in" type="button" aria-pressed="false">
            <span class="header-sign-in-label">Sign in</span>
            <svg viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
              <circle cx="16" cy="16" r="13" stroke="currentColor" stroke-width="1.3"/>
              <circle cx="16" cy="12" r="4" stroke="currentColor" stroke-width="1.3"/>
              <path d="M8.5 24c1.4-3.2 4.1-4.8 7.5-4.8 2.4 0 4.4.8 5.9 2.5M25 17v7m-3.5-3.5h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="browser" aria-label="Documentation browser">
        <div class="toolbar">
          <div class="toolbar-actions">
            <button id="moveHereButton" class="button button-secondary" type="button" data-mobile-icon-only aria-label="Move selected items" title="Move selected items" hidden>Move Here</button>
            <button id="createFolderButton" class="button button-secondary" type="button" data-mobile-icon-only aria-label="Create new directory" title="Create new directory" hidden>
              <svg class="button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9ZM12 10v6m-3-3h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="button-label">New Directory</span>
            </button>
            <button id="uploadButton" class="button" type="button" data-mobile-icon-only aria-label="Upload files" title="Upload files" hidden>
              <svg class="button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14.5v3A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="button-label">Upload Files</span>
            </button>
            <button id="uploadFolderButton" class="button button-secondary" type="button" data-mobile-icon-only aria-label="Upload folder" title="Upload folder" hidden>
              <svg class="button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Zm9 3v6m-3-3h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="button-label">Upload Folder</span>
            </button>
            <button id="downloadSelectedButton" class="button button-secondary" type="button" data-mobile-icon-only aria-label="Download selected files" title="Download selected files" hidden>
              <svg class="button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="button-label">Download Selected</span>
            </button>
            <button id="removeButton" class="button button-secondary danger" type="button" data-mobile-icon-only aria-label="Delete selected items" title="Delete selected items" hidden>
              <svg class="button-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M4.5 7h15M9 7V4.5h6V7m2.5 0-.8 13h-9.4L6.5 7m3.5 3v6m4-6v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <span class="button-label">Delete</span>
            </button>
            <input id="fileInput" type="file" multiple hidden />
            <input id="folderInput" type="file" webkitdirectory directory multiple hidden />
          </div>
        </div>

        <div class="meta-row">
          <nav id="breadcrumbs" class="breadcrumbs" aria-label="Breadcrumb"></nav>
          <div class="meta-controls">
            <span id="selectionStatus" class="selection-status" aria-live="polite"></span>
            <label class="filter-control">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
                <path d="M4 5h16l-6.2 7.2v5.1l-3.6 1.8v-6.9L4 5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
              </svg>
              <select id="fileFilter" aria-label="Filter files">
                <option value="folder">-- None --</option>
                <option value="all">All files</option>
              </select>
            </label>
            <span id="itemCount" class="item-count"></span>
          </div>
        </div>

        <div class="table-wrap">
          <table class="file-table">
            <thead>
              <tr>
                <th class="checkbox-column"><input id="selectAll" type="checkbox" aria-label="Select all items" /></th>
                <th data-sort-key="name" class="sortable-column"><button type="button" class="sort-button" data-sort-key="name" aria-label="Sort by name"><span class="sort-label">Name</span><span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="type" class="sortable-column"><button type="button" class="sort-button" data-sort-key="type" aria-label="Sort by type"><span class="sort-label">Type</span><span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="size" class="sortable-column"><button type="button" class="sort-button" data-sort-key="size" aria-label="Sort by size"><span class="sort-label">Size</span><span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th data-sort-key="createdOn" class="sortable-column"><button type="button" class="sort-button" data-sort-key="createdOn" aria-label="Sort by created date"><span class="sort-label">Created On</span><span class="sort-indicator" aria-hidden="true">↕</span></button></th>
                <th class="action-column"><span class="visually-hidden">Actions</span></th>
              </tr>
            </thead>
            <tbody id="fileRows"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state" role="status" aria-live="polite">
          <h2>No documents found</h2>
          <p>Try another search or refresh the repository.</p>
        </div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <div hidden aria-hidden="true" style="display:none">
      <div class="header-utilities"></div>
      <table><tbody><tr><th>Created On</th></tr></tbody></table>
      <div>Created On (newest)</div>
    </div>

    <dialog id="moveConfirmationDialog" class="confirmation-dialog" aria-labelledby="moveConfirmationTitle" aria-describedby="moveConfirmationMessage">
      <h2 id="moveConfirmationTitle"></h2>
      <p id="moveConfirmationMessage"></p>
      <div class="confirmation-actions">
        <button id="cancelMoveButton" class="button button-secondary" type="button" autofocus>Cancel</button>
        <button id="confirmMoveButton" class="button" type="button">Move</button>
      </div>
    </dialog>

    <aside id="activityPanel" class="activity-panel" aria-live="polite" hidden>
      <div class="activity-header">
        <div>
          <h2 id="activityTitle" class="activity-title"></h2>
          <p id="activitySummary" class="activity-summary"></p>
        </div>
        <button id="activityClose" class="activity-close" type="button" aria-label="Close upload status">×</button>
      </div>
      <div id="activityItems" class="activity-items"></div>
    </aside>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
    <script src="./file-types.js" defer></script>
    <script src="./index.js" defer></script>
  </body>
</html>
